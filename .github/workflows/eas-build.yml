name: Build app (APK / store)

# A new installable build. Only needed when native code changes (a new native
# package, app.json plugins, permissions, icon, version bump); everything else
# ships as an update (eas-update.yml). Started by hand from the Actions tab.
# The build runs on Expo's servers; the download link appears on expo.dev and in
# the job log. Needs the EXPO_TOKEN secret (see eas-update.yml).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: eas.json build profile
        type: choice
        options: [preview, production, development]
        default: preview
      platform:
        type: choice
        options: [android, ios, all]
        default: android

jobs:
  build:
    name: ${{ inputs.profile }} build (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Expo access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (see eas-update.yml)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start the build on Expo
        run: eas build --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}" --non-interactive --no-wait
