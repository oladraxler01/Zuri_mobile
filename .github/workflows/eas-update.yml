name: Publish app update

# CD for over-the-air updates. After CI passes on main, the new JavaScript is
# published to the "preview" channel, so every installed test APK picks it up
# (see docs/BUILDS.md). Production is published by hand from the Actions tab.
#
# Needs the repository secret EXPO_TOKEN: an access token from the Expo account
# that owns this project (app.json extra.eas.projectId). Without it this job
# is skipped with a warning (manual runs fail); nothing else is affected.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Which installed builds get it
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: What changed (shown in the Expo dashboard)
        type: string
        required: false

concurrency:
  group: eas-update-${{ inputs.channel || 'preview' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ inputs.channel || 'preview' }}
    # Automatic runs: only after a successful CI run for a push to main (not for pull requests).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Expo access
        id: access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          MSG="No EXPO_TOKEN secret, so nothing was published. Add it under Settings → Secrets and variables → Actions; create it at expo.dev → Access tokens, in the Expo account that owns this project."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$MSG"; exit 1; fi
          echo "::warning::$MSG"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.access.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.access.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.access.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.access.outputs.ok == 'true'
        run: npm ci

      - name: Publish
        if: steps.access.outputs.ok == 'true'
        env:
          CHANNEL: ${{ inputs.channel || 'preview' }}
          MESSAGE: ${{ inputs.message || github.event.workflow_run.head_commit.message || 'Update' }}
        run: |
          FIRST_LINE="$(printf '%s' "$MESSAGE" | head -n 1)"
          node scripts/publish-update.mjs "$CHANNEL" "$FIRST_LINE"
