# Testers: every push to main → test → update on the "preview" channel.
# Runs on Expo's servers (EAS Workflows), started by the GitHub app linked in the
# project's GitHub settings on expo.dev.
#
# This is an over-the-air update, not a new app build: installed test APKs
# download the new JavaScript. Production goes out in batches, only when you
# release (.eas/workflows/release.yml). New builds are only for native changes
# (.eas/workflows/build-preview-apk.yml). See docs/BUILDS.md.
# Add [eas skip] to a commit message to skip this workflow.

name: Test and stage for testers

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck, lint and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci

  stage:
    name: Update testers (preview channel)
    needs: [test]
    type: update
    environment: preview
    # The same values the preview APKs were built with (eas.json build.preview.env).
    env:
      EXPO_PUBLIC_API_GATEWAY_URL: https://api.zurilearn.com
      EXPO_PUBLIC_USE_LIVE_API: 'true'
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_DIAGNOSTICS: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    params:
      channel: preview
      platform: all
