# Push to main → test → stage (testers) → approve → release (production).
# Runs on Expo's servers (EAS Workflows), started by the GitHub app linked in the
# project's GitHub settings on expo.dev. No GitHub secret needed.
#
# Updates only reach installed builds on the same channel and app version
# (app.json "version", runtimeVersion policy appVersion). Native changes need a
# new build instead (.eas/workflows/build-preview-apk.yml). See docs/BUILDS.md.
# Add [eas skip] to a commit message to skip this workflow.

name: Test, stage and release

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck, lint and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci

  stage:
    name: Stage for testers (preview channel)
    needs: [test]
    type: update
    environment: preview
    # The same values the preview APKs were built with (eas.json build.preview.env).
    env:
      EXPO_PUBLIC_API_GATEWAY_URL: https://api.zurilearn.com
      EXPO_PUBLIC_USE_LIVE_API: 'true'
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_DIAGNOSTICS: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    params:
      channel: preview
      platform: all

  approve:
    name: Release this to production?
    needs: [stage]
    type: require-approval

  release:
    name: Release (production channel)
    needs: [approve]
    type: update
    environment: production
    # eas.json build.production.env
    env:
      EXPO_PUBLIC_API_GATEWAY_URL: https://api.zurilearn.com
      EXPO_PUBLIC_USE_LIVE_API: 'true'
      EXPO_PUBLIC_APP_ENV: production
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    params:
      channel: production
      platform: all
